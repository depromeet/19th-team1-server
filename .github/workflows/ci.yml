name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      # 포맷 검사(ktlintCheck)와 테스트(Testcontainers MySQL)를 포함한다.
      - run: ./gradlew build
