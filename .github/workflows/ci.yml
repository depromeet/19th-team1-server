name: CI

# 테스트 범위 (규칙과 이유: docs/ci.md)
#   - main 대상 PR, main 푸시, 수동 실행: 전체 테스트
#   - 그 밖의 브랜치 푸시(기능 브랜치, develop): 바뀐 모듈과 그 모듈에 의존하는 모듈의 테스트. 구조 테스트는 항상
# 이미지: develop·main 에 푸시되고 검사(test, docs)를 통과하면 GHCR 에 올린다. 지문(실행 jar, Dockerfile, .dockerignore 의 sha256)이 같은 이미지가 있으면 새로 만들지 않고 태그만 옮긴다.
#   올린 뒤 브랜치별 최근 5개를 넘는 오래된 이미지를 정리한다(scripts/ci/cleanup-images.sh).
# 배포: develop 이미지를 올리면 개발 서버에 반영하고 상태 확인(/actuator/health)이 UP 인지 본다. 운영 서버 배포는 없다.
on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR·같은 기능 브랜치에 새로 푸시하면 진행 중인 이전 실행을 취소한다. 결과가 쓰이는 것은 마지막 커밋의 검사뿐이다.
# main·develop 푸시는 취소하지 않고 앞 실행이 끝나기를 기다린다. 이미지를 올리거나 개발 서버에 반영하는 도중에 끊기지 않게 한다.
# (PR 실행의 github.ref 는 refs/pull/<번호>/merge 라 취소 쪽에 든다.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # develop 의 테스트 선택이 마지막으로 성공한 실행을 조회한다.
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          # 테스트 선택이 base 커밋과 비교해 바뀐 파일을 찾는다.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6

      - name: 실행 범위 결정
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT" == "pull_request" || "$EVENT" == "workflow_dispatch" || "$REF" == "refs/heads/main" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      # 포맷 검사(ktlintCheck)와 테스트(Testcontainers PostgreSQL)를 포함한다.
      - name: 전체 테스트
        if: steps.scope.outputs.full == 'true'
        run: ./gradlew ktlintCheck build

      - name: 테스트 선택
        if: steps.scope.outputs.full != 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/select-tests.sh
          cat build/ci/selection.md >> "$GITHUB_STEP_SUMMARY"

      # 테스트 선택이 쓴 태스크를 실행한다. 고른 모듈의 테스트 전부, 구조 테스트, 모든 모듈의 포맷 검사.
      - name: 고른 테스트 실행
        if: steps.scope.outputs.full != 'true'
        run: |
          mapfile -t tasks < build/ci/tasks.txt
          ./gradlew "${tasks[@]}"

  # 문서 검사와 Gradle 밖의 스크립트 테스트. 바뀐 파일과 관계없이 항상 돈다(몇 초 걸린다).
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # roadmap 의 이슈 번호가 실제 이슈인지 조회한다.
      issues: read
    steps:
      - uses: actions/checkout@v6
      - name: 문서 검사
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-docs.sh
      - name: 문서 검사 스크립트 테스트
        run: scripts/test-check-docs.sh
      - name: 다음 스토리 고르기 테스트
        run: scripts/claude/test-next-story.sh
      - name: 이미지 정리 스크립트 테스트
        run: scripts/ci/test-cleanup-images.sh
      - name: 문서 정합성 결과 스크립트 테스트
        run: scripts/ci/test-doc-review-report.sh

  # 검사 잡(test, docs)이 모두 통과해야 이미지를 올린다. CI 가 실패한 커밋은 이미지도 배포도 나가지 않는다.
  image:
    needs: [test, docs]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6

      # 이미지 지문: 실행 jar 와 Dockerfile·.dockerignore 의 sha256 을 합친 값. 이 값이 같은 이미지(fp-<지문> 태그)가
      # 이미 있으면 새로 빌드하지 않는다. 같은 코드로 다시 빌드하면 jar 가 바이트 단위로 같다(루트 build.gradle.kts 의 아카이브 설정).
      - name: 실행 jar 와 지문
        id: fingerprint
        run: |
          ./gradlew :api:bootJar
          fingerprint=$(sha256sum api/build/libs/*.jar Dockerfile .dockerignore | sha256sum | cut -d' ' -f1)
          echo "value=$fingerprint" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 이름과 태그
        id: tags
        env:
          REPOSITORY: ${{ github.repository }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          {
            echo "fingerprint=$image:fp-$FINGERPRINT"
            # 브랜치 이력 태그: 그 브랜치에서 언제 어느 커밋으로 쓰였는지 남긴다. 롤백과 브랜치별 보관에 쓴다.
            echo "history=$image:$BRANCH-$(date -u +%Y%m%d-%H%M%S)-${SHA::7}"
            echo "branch=$image:$BRANCH"
          } >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image:fp-$FINGERPRINT" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 같은 지문의 이미지가 이미 있으면 빌드하지 않는다. 브랜치 태그와 이력 태그만 그 이미지로 옮긴다.
      - name: 태그만 옮기기
        if: steps.tags.outputs.exists == 'true'
        env:
          FINGERPRINT_TAG: ${{ steps.tags.outputs.fingerprint }}
          HISTORY_TAG: ${{ steps.tags.outputs.history }}
          BRANCH_TAG: ${{ steps.tags.outputs.branch }}
        run: |
          # --prefer-index=false: 원본 이미지를 그대로 가리키게 한다. 기본값은 원본을 감싼 새 인덱스를 만들어 digest 가 달라진다.
          docker buildx imagetools create --prefer-index=false --tag "$BRANCH_TAG" --tag "$HISTORY_TAG" "$FINGERPRINT_TAG"
          echo "지문이 같은 이미지가 있어 새로 만들지 않았다: $FINGERPRINT_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: 이미지 빌드·푸시
        if: steps.tags.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # 빌드 증명을 첨부하면 이미지 하나가 레지스트리에 여러 조각으로 저장돼 정리가 복잡해진다. 서버에서만 쓰는 이미지라 첨부하지 않는다.
          provenance: false
          tags: |
            ${{ steps.tags.outputs.fingerprint }}
            ${{ steps.tags.outputs.history }}
            ${{ steps.tags.outputs.branch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            team1.fingerprint=${{ steps.fingerprint.outputs.value }}

      # 브랜치(main, develop)별 최근 5개 이미지만 남긴다. DRY_RUN 이 true 면 지울 목록만 요약(Summary)에 출력한다.
      - name: 오래된 이미지 정리
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
          KEEP: "5"
          DRY_RUN: "true"
        run: scripts/ci/cleanup-images.sh

  # develop 이미지를 올린 뒤 개발 서버에 SSH 로 접속해 새 이미지로 다시 띄운다. 접속 정보는 GitHub Environment dev 에 있다.
  deploy-dev:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    permissions: {}
    # SSH 나 이미지 받기가 멈춰도 러너와 다음 배포를 오래 붙잡지 않게 한다.
    timeout-minutes: 10
    # 배포가 겹치지 않게 한다. 진행 중인 배포는 취소하지 않는다.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: 서버에 새 이미지 반영
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 서버 호스트 키를 미리 넣어 두고, 키가 다르면 접속하지 않는다.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /srv/team1 && docker compose pull app && docker compose up -d --no-deps app'

      # 5초 간격으로 2분까지 기다린다. 앱이 뜨는 시간을 포함한다. 요청이 오래 걸려도 2분이 지나면 멈추도록 횟수가 아니라 경과 시간으로 끝낸다.
      - name: 상태 확인
        env:
          HEALTH_URL: ${{ vars.DEV_HEALTH_URL }}
        run: |
          deadline=$((SECONDS + 120))
          while ((SECONDS < deadline)); do
            if curl -fsS --max-time 5 "$HEALTH_URL" | grep -q '"status":"UP"'; then
              echo "개발 서버 UP" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "2분 안에 UP 이 되지 않았다: $HEALTH_URL" >&2
          exit 1

  # CI 의 검사 잡(test, docs) 결과를 이 잡 하나로 모은다. 머지 뒤에 도는 image 잡은 넣지 않는다. 브랜치 보호는 이 잡과 Convention 워크플로의 convention 을 필수 검사로 둔다.
  # 검사 잡을 추가하면(예: SDD 스펙 검사) 이 잡과 image 잡의 needs 에 더한다.
  # 필수 검사 이름 `ci-result` 는 main 대상 PR 실행(전체 테스트)에만 붙인다. 같은 커밋의 브랜치 푸시 실행(선택 테스트)도
  # 같은 이름을 남기면 GitHub 이 어느 결과로 머지를 허락할지 문서에 정해져 있지 않다. 그래서 다른 이벤트는 이름 뒤에 이벤트를 붙인다.
  ci-result:
    name: ${{ github.event_name == 'pull_request' && 'ci-result' || format('ci-result ({0})', github.event_name) }}
    if: always()
    needs: [test, docs]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [[ "$result" == "success" || "$result" == "skipped" ]] || exit 1
          done
