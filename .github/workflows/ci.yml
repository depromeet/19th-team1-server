name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

permissions:
  contents: read

# 같은 PR·같은 브랜치에 새로 푸시하면 진행 중인 이전 실행을 취소한다. 결과가 쓰이는 것은 마지막 커밋의 검사뿐이다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      # 포맷 검사(ktlintCheck)와 테스트(Testcontainers MySQL)를 포함한다.
      - run: ./gradlew build
