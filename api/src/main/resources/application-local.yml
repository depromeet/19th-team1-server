spring:
  config:
    # 레포 루트의 .env 를 읽는다. 실행 위치가 루트(./)이든 모듈 폴더(../)이든 찾을 수 있게 둘 다 적는다.
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

logging:
  level:
    org.hibernate.SQL: debug

# 로컬 작업 큐는 docker compose 의 ElasticMQ 다(compose.yaml, docker/elasticmq.conf).
job:
  queue:
    url: ${SQS_QUEUE_URL:http://localhost:9324/000000000000/team1-jobs}
    region: ${SQS_REGION:ap-southeast-2}
    endpoint: ${SQS_ENDPOINT:http://localhost:9324}
