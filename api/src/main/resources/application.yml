spring:
  application:
    name: team1-server
  threads:
    virtual:
      # 요청과 예약 작업을 가상 스레드로 처리한다. DB·외부 API 응답을 기다리는 동안 OS 스레드를 잡지 않는다.
      enabled: true
  profiles:
    # SPRING_PROFILES_ACTIVE 를 주지 않으면 local 로 뜬다. 서버에서는 반드시 dev 또는 prod 를 지정한다.
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 가 만들고, Hibernate 는 엔티티와 맞는지만 검사한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

# 처리 작업과 작업 큐(docs/deployment.md 6절). 기본값은 운영 값을 정하기 전의 임시 값이다.
job:
  queue:
    url: ${SQS_QUEUE_URL}
    region: ${SQS_REGION}
    # 로컬에서 ElasticMQ 주소를 넣는다. 비우면 AWS SQS 에 붙는다.
    endpoint: ${SQS_ENDPOINT:}
  # DB 시도 횟수 상한. 이 횟수째 실행이 실패하면 FAILED 로 끝낸다.
  max-attempts: ${JOB_MAX_ATTEMPTS:3}
  # 받은 메시지의 가시성 제한 시간이자 RUNNING 작업을 멈춘 것으로 보는 시간. 링크 수집 + LLM 타임아웃보다 길게 둔다.
  visibility-timeout: ${JOB_VISIBILITY_TIMEOUT:PT5M}
  # 이보다 오래 PENDING·QUEUED 인 작업을 다시 발행한다.
  republish-after: ${JOB_REPUBLISH_AFTER:PT10M}
  republish-interval: PT5M
  republish-batch-size: 100

worker:
  # 작업 큐 받기 루프를 켠다.
  enabled: ${WORKER_ENABLED:true}
  # 동시에 처리하는 작업 수.
  concurrency: ${WORKER_CONCURRENCY:4}

scheduler:
  # 예약 작업(멈춘 작업 재발행)을 켠다.
  enabled: ${SCHEDULER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        # 상태 확인만 연다. 힙 덤프·환경변수 같은 엔드포인트는 비밀값이 드러날 수 있어 열지 않는다.
        include: health
