spring:
  application:
    name: team1-server
  threads:
    virtual:
      # 요청과 예약 작업을 가상 스레드로 처리한다. DB·외부 API 응답을 기다리는 동안 OS 스레드를 잡지 않는다.
      enabled: true
  profiles:
    # SPRING_PROFILES_ACTIVE 를 주지 않으면 local 로 뜬다. 서버에서는 반드시 dev 또는 prod 를 지정한다.
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 가 만들고, Hibernate 는 엔티티와 맞는지만 검사한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        # 상태 확인만 연다. 힙 덤프·환경변수 같은 엔드포인트는 비밀값이 드러날 수 있어 열지 않는다.
        include: health
