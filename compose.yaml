# 로컬 개발용 MySQL. 값은 레포 루트의 .env 에서 읽는다 (cp .env.example .env).
services:
  mysql:
    image: mysql:8.4
    container_name: team1-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:?.env 에 DB_NAME 을 설정하세요}
      MYSQL_USER: ${DB_USERNAME:?.env 에 DB_USERNAME 을 설정하세요}
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?.env 에 DB_ROOT_PASSWORD 를 설정하세요}
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
