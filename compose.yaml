# 로컬 개발용 PostgreSQL. 값은 레포 루트의 .env 에서 읽는다 (cp .env.example .env).
services:
  postgres:
    image: postgres:16
    container_name: team1-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?.env 에 DB_NAME 을 설정하세요}
      POSTGRES_USER: ${DB_USERNAME:?.env 에 DB_USERNAME 을 설정하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
