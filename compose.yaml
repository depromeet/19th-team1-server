# 로컬 개발용 PostgreSQL 과 작업 큐(ElasticMQ). PostgreSQL 값은 레포 루트의 .env 에서 읽는다 (cp .env.example .env).
services:
  postgres:
    image: postgres:16
    container_name: team1-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?.env 에 DB_NAME 을 설정하세요}
      POSTGRES_USER: ${DB_USERNAME:?.env 에 DB_USERNAME 을 설정하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # SQS 호환 작업 큐. 큐는 docker/elasticmq.conf 에 정의한다.
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    container_name: team1-elasticmq
    ports:
      - "127.0.0.1:9324:9324"
    volumes:
      - ./docker/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  postgres-data:
